<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1b382d"/>
      <stop offset="100%" stop-color="#0f1915"/>
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffd56b"/>
      <stop offset="100%" stop-color="#e5a824"/>
    </linearGradient>
    <linearGradient id="mint" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e8f7ee"/>
      <stop offset="100%" stop-color="#9fcab5"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000" flood-opacity="0.35"/>
    </filter>
  </defs>
  <!-- Background with smooth rounded corners -->
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  <rect x="8" y="8" width="496" height="496" rx="104" fill="none" stroke="#2a5242" stroke-width="3" opacity="0.6"/>
  <!-- Bag base -->
  <g filter="url(#shadow)">
    <!-- Bag handles -->
    <path d="M196 175 V 130 C 196 95 220 70 256 70 C 292 70 316 95 316 130 V 175" fill="none" stroke="url(#gold)" stroke-width="26" stroke-linecap="round"/>
    <!-- Bag body -->
    <path d="M136 170 L 160 410 C 162 428 178 442 196 442 L 316 442 C 334 442 350 428 352 410 L 376 170 C 378 152 364 136 346 136 L 166 136 C 148 136 134 152 136 170 Z" fill="#1e4637" stroke="#37725a" stroke-width="8"/>
    <!-- Inner letter I -->
    <path d="M 226 220 H 286 M 256 220 V 360 M 226 360 H 286" fill="none" stroke="url(#mint)" stroke-width="20" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- Growth spark / star in top right -->
    <path d="M 370 105 Q 370 130 395 130 Q 370 130 370 155 Q 370 130 345 130 Q 370 130 370 105 Z" fill="url(#gold)"/>
    <circle cx="370" cy="130" r="4" fill="#ffffff"/>
  </g>
</svg>
